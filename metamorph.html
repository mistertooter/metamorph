:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080c1c;color:#f2f5ff;font-family:system-ui,Segoe UI,Arial,sans-serif}.wrap{max-width:960px;margin:auto;padding:22px}.screen{position:relative;aspect-ratio:3/4;max-height:690px;margin:auto;overflow:hidden;border:1px solid #465486;border-radius:22px;background:radial-gradient(ellipse at 50% 42%,#20346c 0%,#0d1638 38%,#050816 82%);box-shadow:0 24px 80px #0009}canvas{width:100%;height:100%;display:block}.hud{position:absolute;left:0;right:0;top:18px;text-align:center;pointer-events:none}.hud h1{font-size:clamp(20px,4vw,32px);letter-spacing:.16em;margin:0;text-shadow:0 0 20px #7fd7ff}.hud p{color:#b9c7ee;font-size:13px;letter-spacing:.15em}.stage{position:absolute;bottom:22px;left:16px;right:16px;text-align:center;font-weight:800;letter-spacing:.16em;font-size:clamp(15px,3vw,22px);text-shadow:0 0 20px #fff9}.controls{display:flex;justify-content:center;gap:12px;margin:15px 0;flex-wrap:wrap}button{background:#283f89;border:1px solid #789bff;color:white;border-radius:12px;padding:11px 20px;font-size:16px;cursor:pointer}button:hover{background:#3957b2}.note{color:#b8c6e8;text-align:center}.code-title{margin:32px 0 12px;font-size:24px}pre{margin:0;max-height:520px;overflow:auto;background:#10182d;border:1px solid #40517a;border-radius:15px;padding:20px;color:#e7f0ff;font-size:13px;line-height:1.5;tab-size:2;white-space:pre}code{font-family:Consolas,Monaco,monospace}@media(max-width:600px){.wrap{padding:10px}.screen{border-radius:14px}}
</style></head><body><main class="wrap"><section class="screen"><canvas id="scene" aria-label="Animated diamond morphing into circle, sphere, then square" width="516" height="688"></canvas><div class="hud"><h1>METAMORPHOSIS</h1><p>DIAMOND · CIRCLE · SPHERE · SQUARE</p></div><div class="stage" id="stage">DIAMOND</div></section><div class="controls"><button id="toggle">Pause</button><button id="restart">Restart</button><button id="copy">Copy source</button></div><p class="note">A seamless 12-second animation. The sphere uses animated 3D-style lighting and contour shading.</p><h2 class="code-title">Complete HTML · CSS · JavaScript source</h2><pre><code id="source"></code></pre></main><script>
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),stageEl=document.getElementById('stage');let W=600,H=800,elapsed=0,last=0,paused=false;const TAU=Math.PI*2,cycle=12;const colors=[[40,215,255],[210,80,255],[255,164,65],[70,255,173]];const names=['DIAMOND','CIRCLE','3D BALL','SQUARE'];const particles=Array.from({length:110},(_,i)=>({x:Math.random(),y:Math.random(),r:Math.random()*1.8+.3,s:Math.random()*.25+.05,phase:Math.random()*TAU}));function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();const clamp=x=>Math.max(0,Math.min(1,x));const ease=x=>{x=clamp(x);return x*x*(3-2*x)};function mix(a,b,t){return a+(b-a)*t}function rgb(a,b,t){return a.map((v,i)=>Math.round(mix(v,b[i],t)))}function css(c,a=1){return `rgba(${c[0]},${c[1]},${c[2]},${a})`};function contour(type,a){let x,y;if(type===0){const pts=[[0,-1],[1,0],[0,1],[-1,0]],f=a/TAU*4,k=Math.floor(f)%4,t=f-k;x=mix(pts[k][0],pts[(k+1)%4][0],t);y=mix(pts[k][1],pts[(k+1)%4][1],t)}else if(type===3){const pts=[[-1,-1],[1,-1],[1,1],[-1,1]],f=a/TAU*4,k=Math.floor(f)%4,t=f-k;x=mix(pts[k][0],pts[(k+1)%4][0],t);y=mix(pts[k][1],pts[(k+1)%4][1],t);x*=.83;y*=.83}else{x=Math.cos(a);y=Math.sin(a)}return [x,y]}function draw(t){ctx.clearRect(0,0,W,H);const cx=W/2,cy=H*.49,R=Math.min(W*.285,H*.22),section=Math.floor(t/3)%4,next=(section+1)%4,local=(t%3)/3,transition=ease((local-.57)/.38),isBall=mix(section===2?1:0,next===2?1:0,transition),c=rgb(colors[section],colors[next],transition);stageEl.textContent=local>.77?`${names[section]} → ${names[next]}`:names[section];let halo=ctx.createRadialGradient(cx,cy,0,cx,cy,R*2.7);halo.addColorStop(0,css(c,.15));halo.addColorStop(1,css(c,0));ctx.fillStyle=halo;ctx.fillRect(0,0,W,H);for(const p of particles){let x=p.x*W+Math.sin(t*.5+p.phase)*14,y=((p.y+t*p.s/8)%1)*H;ctx.beginPath();ctx.arc(x,y,p.r,0,TAU);ctx.fillStyle=css(c,.18+.24*(Math.sin(t*2+p.phase)+1)/2);ctx.fill()}ctx.save();ctx.translate(cx,cy);ctx.rotate(Math.sin(t*1.3)*.035);const scale=1+.035*Math.sin(t*2.2);ctx.scale(scale,scale);ctx.shadowBlur=R*.45;ctx.shadowColor=css(c,.9);ctx.beginPath();const N=160;for(let i=0;i<=N;i++){let a=i/N*TAU,p=contour(section,a),q=contour(next,a),x=mix(p[0],q[0],transition)*R,y=mix(p[1],q[1],transition)*R;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath();const grad=ctx.createLinearGradient(-R,-R,R,R);grad.addColorStop(0,css(rgb(c,[255,255,255],.42)));grad.addColorStop(.45,css(c));grad.addColorStop(1,css(rgb(c,[7,12,35],.65)));ctx.fillStyle=grad;ctx.fill();ctx.shadowBlur=0;ctx.lineWidth=3;ctx.strokeStyle=css(rgb(c,[255,255,255],.7),.95);ctx.stroke();if(isBall>.01){ctx.save();ctx.clip();let g=ctx.createRadialGradient(-R*.4,-R*.46,R*.02,R*.13,R*.16,R*1.5);g.addColorStop(0,`rgba(255,255,255,${.9*isBall})`);g.addColorStop(.3,css(c,.42*isBall));g.addColorStop(.75,`rgba(12,8,40,${.18*isBall})`);g.addColorStop(1,`rgba(0,0,0,${.8*isBall})`);ctx.fillStyle=g;ctx.fillRect(-R,-R,R*2,R*2);ctx.lineWidth=1.5;for(let k=-3;k<=3;k++){ctx.beginPath();ctx.ellipse(0,0,R*Math.abs(Math.cos(k*.19+t*.16)),R,0,0,TAU);ctx.strokeStyle=css([255,255,255],.12*isBall);ctx.stroke()}ctx.restore()}else{ctx.strokeStyle=css([255,255,255],.19);ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(-R*.4,-R*.3);ctx.lineTo(0,R*.42);ctx.lineTo(R*.4,-R*.3);ctx.stroke()}ctx.restore();ctx.strokeStyle=css(c,.2);ctx.lineWidth=1;for(let k=0;k<3;k++){ctx.beginPath();ctx.ellipse(cx,cy+R*1.32,R*(1.1+k*.17),R*(.13+k*.04),0,0,TAU);ctx.stroke()}const progress=t/cycle;ctx.fillStyle='#ffffff25';ctx.fillRect(W*.14,H*.91,W*.72,3);ctx.fillStyle=css(c);ctx.fillRect(W*.14,H*.91,W*.72*progress,3)}function frame(ts){if(!last)last=ts;let dt=Math.min((ts-last)/1000,.05);last=ts;if(!paused)elapsed=(elapsed+dt)%cycle;draw(elapsed);requestAnimationFrame(frame)}requestAnimationFrame(frame);document.getElementById('toggle').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause'};document.getElementById('restart').onclick=()=>{elapsed=0;paused=false;document.getElementById('toggle').textContent='Pause'};document.getElementById('copy').onclick=async()=>{const src=document.documentElement.outerHTML.replace(/<code id="source">[\s\S]*?<\/code>/,'<code id="source"></code>');try{await navigator.clipboard.writeText('<!doctype html>'+src);document.getElementById('copy').textContent='Copied!'}catch{document.getElementById('copy').textContent='Select code below'}};const code=document.documentElement.outerHTML.replace(/<code id="source">[\s\S]*?<\/code>/,'<code id="source"></code>');document.getElementById('source').textContent='<!doctype html>'+code;
</script></body></html>
